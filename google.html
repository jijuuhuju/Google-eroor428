<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Google</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header class="header">
    <nav class="nav">
      <a href="#">Gmail</a>
      <a href="#">画像</a>
      <button class="apps-button" aria-label="Google アプリ">
        ⋮⋮⋮
      </button>
      <button class="login-button">ログイン</button>
    </nav>
  </header>

  <main class="main">
    <img
      src="logo.svg"
      alt="Google"
      class="logo"
    >

    <form class="search-form" id="searchForm">
      <div class="search-box">
        <span class="search-icon">⌕</span>

        <input
          type="search"
          id="searchInput"
          name="q"
          autocomplete="off"
          aria-label="検索"
        >

        <button
          type="button"
          class="clear-button"
          id="clearButton"
          aria-label="検索内容を消去"
        >
          ×
        </button>
      </div>

      <div class="search-buttons">
        <button type="submit">Google 検索</button>
        <button type="button" id="luckyButton">
          I'm Feeling Lucky
        </button>
      </div>
    </form>

    <div class="language">
      Google offered in:
      <a href="#">English</a>
    </div>
  </main>

  <footer class="footer">
    <div class="footer-country">日本</div>

    <div class="footer-links">
      <div>
        <a href="#">広告</a>
        <a href="#">ビジネス</a>
        <a href="#">検索の仕組み</a>
      </div>

      <div>
        <a href="#">プライバシー</a>
        <a href="#">規約</a>
        <a href="#">設定</a>
      </div>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
