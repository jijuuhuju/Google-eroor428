<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">

  <meta
   name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Google</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header class="top-header">
    <a href="#" class="header-link">Gmail</a>
    <a href="#" class="header-link">画像</a>
  </header>


  <main class="google-main">

    <!-- =================================
         ロゴ
    ================================== -->

    <div class="logo-wrapper">

      <!-- 異変時だけ表示される背面ロゴ -->
      <img
        src="logo.svg"
        class="glitch-logo-back"
        alt=""
        aria-hidden="true"
      >

      <!-- 常に表示される正常ロゴ -->
      <img
        src="logo.svg"
        class="glitch-logo-main"
        alt="Google"
      >

    </div>


    <!-- =================================
         検索フォーム
    ================================== -->

    <form id="searchForm">

      <div class="search-box">

        <input
          id="searchInput"
          type="text"
          autocomplete="off"
          aria-label="検索"
        >

        <button
          id="clearButton"
          type="button"
          aria-label="入力を消去"
        >
          ×
        </button>

      </div>


      <div class="search-buttons">

        <button
          type="submit"
          class="search-button"
        >
          Google 検索
        </button>

        <button
          type="button"
          id="luckyButton"
          class="search-button"
        >
          I'm Feeling Lucky
        </button>

      </div>

    </form>

  </main>


  <!-- =================================
       Error画面
  ================================== -->

  <div
    id="errorOverlay"
    class="error-overlay"
  >
    <div id="errorText"></div>
  </div>


  <!-- =================================
       最終イベント
  ================================== -->

  <div
    id="finalOverlay"
    class="final-overlay"
  >

    <div
      id="redFigure"
      class="red-figure"
    >
      <div class="figure-head"></div>
      <div class="figure-body"></div>
      <div class="figure-arm figure-arm-left"></div>
      <div class="figure-arm figure-arm-right"></div>
    </div>

    <pre
      id="typing428"
      class="typing428"
    ></pre>

    <div
      id="final428"
      class="final428"
    >
      428
    </div>

  </div>


  <script src="app.js"></script>

<!-- =========================================
     最終異変
========================================= -->

<div id="finalGlitch">
  <div id="redFigure"></div>
  <div id="typing428"></div>
  <div id="finalBlack"></div>
  <div id="final428">428</div>
</div>

</body>
</html>
